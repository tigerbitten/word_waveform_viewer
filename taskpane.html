<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>waveform taskpane</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://cdn.jsdelivr.net/npm/wavedrom@3/skins/default.js"></script>
<script src="https://cdn.jsdelivr.net/npm/wavedrom@3/wavedrom.min.js"></script>
<style>
  body { font-family: monospace; margin: 0.5rem; }
  textarea { width: 100%; height: 8rem; }
  #target { border: 1px solid #ccc; margin: 0.5rem 0; min-height: 4rem; }
  #status, #capacityResults { color: red; white-space: pre-wrap; }
  button { margin: 0.25rem 0.25rem 0.25rem 0; }
</style>
</head>
<body>
  <div style="color:#888;font-size:0.8em;">build v9</div>
  <textarea id="src">{ signal: [
    { name: "clk",  wave: "p......." },
    { name: "data", wave: "x.345x..", data: ["a","b","c"] },
    { name: "req",  wave: "0.1..0.." }
  ]}</textarea>

  <div id="status"></div>
  <div id="target"></div>

  <button id="insertBtn">Insert new diagram</button>
  <button id="replaceBtn">Replace selected diagram</button>
  <button id="loadBtn">Load selected diagram</button>
  <button id="capacityBtn">Test alt-text capacity</button>
  <pre id="capacityResults"></pre>

<script>
  const src = document.getElementById('src');
  const target = document.getElementById('target');
  const status = document.getElementById('status');

  const ALT_TEXT_SENTINEL = 'WAVEJSON:v1:';

  function parseWaveJSON(text) {
    // WaveJSON is written as a JS-object literal (unquoted keys, single
    // quotes allowed), not strict JSON. Quote it into real JSON rather than
    // eval-ing it, so a corrupted or hand-edited alt-text field can never
    // execute code -- worst case it just fails to parse.
    const asJSON = text
      .replace(/'([^']*)'/g, '"$1"')
      .replace(/([{,]\s*)([A-Za-z_$][A-Za-z0-9_$]*)\s*:/g, '$1"$2":');
    return JSON.parse(asJSON);
  }

  function render() {
    let json;
    try {
      json = parseWaveJSON(src.value);
      status.textContent = '';
    } catch (e) {
      status.textContent = 'parse error: ' + e.message;
      return;
    }
    target.innerHTML =
      '<script type="WaveDrom">' + JSON.stringify(json) + '<\/script>' +
      '<div id="WaveDrom_Display_0"></div>';
    WaveDrom.ProcessAll();
  }

  function describeError(e) {
    // OfficeExtension errors often have an empty .message but a real .code / debugInfo.
    return (e && (e.code || e.message)) + ' | ' + JSON.stringify(e && e.debugInfo);
  }

  function svgToBase64() {
    const svg = target.querySelector('svg');
    if (!svg) return null;
    const svgString = new XMLSerializer().serializeToString(svg);
    return btoa(unescape(encodeURIComponent(svgString)));
  }

  // Word's insertInlinePictureFromBase64 rejects SVG (GeneralException).
  // Rasterize to PNG via canvas first.
  function svgToPngBase64() {
    const svg = target.querySelector('svg');
    if (!svg) return Promise.resolve(null);
    const svgString = new XMLSerializer().serializeToString(svg);
    const width = svg.width.baseVal.value || svg.getBoundingClientRect().width;
    const height = svg.height.baseVal.value || svg.getBoundingClientRect().height;

    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png').split(',')[1]); // strip "data:image/png;base64,"
      };
      img.onerror = reject;
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
    });
  }

  // Probe Word's actual altTextDescription length limit: write increasing
  // sizes of alt-text to a throwaway image, read each straight back, and
  // report the first size that gets truncated or rejected.
  async function testAltTextCapacity() {
    const results = document.getElementById('capacityResults');
    results.textContent = 'running...\n';
    const sizes = [1000, 5000, 10000, 25000, 50000, 100000, 200000];
    const tinyPng = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';

    for (const size of sizes) {
      const payload = ALT_TEXT_SENTINEL + 'x'.repeat(size);
      try {
        await Word.run(async (context) => {
          const pic = context.document.body.insertInlinePictureFromBase64(tinyPng, Word.InsertLocation.end);
          pic.altTextDescription = payload;
          await context.sync();
          pic.load('altTextDescription');
          await context.sync();
          const got = pic.altTextDescription || '';
          const ok = got === payload;
          results.textContent += size + ' chars: ' + (ok ? 'OK' : 'MISMATCH, got ' + got.length + ' chars back') + '\n';
          if (!ok) throw new Error('stop');
        });
      } catch (e) {
        if (e.message !== 'stop') {
          results.textContent += size + ' chars: FAILED -- ' + describeError(e) + '\n';
        }
        results.textContent += 'stopping at first failure.\n';
        return;
      }
    }
    results.textContent += 'all sizes up to ' + sizes[sizes.length - 1] + ' chars OK.\n';
  }

  // Shared by both Insert and Replace: rasterize the current editor
  // content, then place it either at the end of the doc or over the
  // current selection.
  async function insertOrReplace(mode) {
    let base64;
    try {
      base64 = await svgToPngBase64();
    } catch (e) {
      status.textContent = 'rasterize failed: ' + describeError(e);
      return;
    }
    if (!base64) { status.textContent = 'nothing rendered to insert'; return; }
    let json;
    try {
      json = parseWaveJSON(src.value);
    } catch (e) {
      status.textContent = 'parse error, not inserting: ' + e.message;
      return;
    }
    Word.run(async (context) => {
      let pic;
      if (mode === 'replace') {
        const sel = context.document.getSelection();
        const selectedPics = sel.inlinePictures;
        selectedPics.load('items');
        await context.sync();
        if (selectedPics.items.length === 0) {
          status.textContent = 'nothing selected to replace -- select a diagram first';
          return;
        }
        pic = sel.insertInlinePictureFromBase64(base64, Word.InsertLocation.replace);
      } else {
        pic = context.document.body.insertInlinePictureFromBase64(base64, Word.InsertLocation.end);
      }
      // Canonical JSON, not the raw editor text -- keeps the round-trip
      // format fixed regardless of what shorthand the user typed.
      pic.altTextDescription = ALT_TEXT_SENTINEL + JSON.stringify(json);
      await context.sync();
      status.textContent = mode === 'replace' ? 'replaced' : 'inserted';
    }).catch((e) => { status.textContent = 'insert failed: ' + describeError(e); });
  }

  Office.onReady(() => {
    render();

    document.getElementById('insertBtn').addEventListener('click', () => insertOrReplace('insert'));
    document.getElementById('replaceBtn').addEventListener('click', () => insertOrReplace('replace'));
    document.getElementById('capacityBtn').addEventListener('click', testAltTextCapacity);

    document.getElementById('loadBtn').addEventListener('click', () => {
      Word.run(async (context) => {
        const sel = context.document.getSelection();
        const pics = sel.inlinePictures;
        pics.load('items');
        await context.sync();
        if (pics.items.length === 0) {
          status.textContent = 'select a diagram image first';
          return;
        }
        const pic = pics.items[0];
        pic.load('altTextDescription');
        await context.sync();

        const raw = pic.altTextDescription || '';
        if (!raw.startsWith(ALT_TEXT_SENTINEL)) {
          status.textContent = 'selected image has no recognizable waveform source (alt-text missing or not from this tool)';
          return;
        }
        let json;
        try {
          json = JSON.parse(raw.slice(ALT_TEXT_SENTINEL.length));
        } catch (e) {
          status.textContent = 'diagram source is corrupted, refusing to load: ' + e.message;
          return;
        }
        src.value = JSON.stringify(json, null, 2);
        render();
        status.textContent = 'loaded from selection';
      }).catch((e) => { status.textContent = 'load failed: ' + describeError(e); });
    });
  });

  src.addEventListener('input', render);
</script>
</body>
</html>
